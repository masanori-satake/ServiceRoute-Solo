name: 'リリースパッケージ公開 (Release Package)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: '共通リリース処理実行 (Execute Base Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    # project_name=リポジトリ名, releases/*.zip 添付などの統一パラメータは base 側に閉じ込め済み。
    # npm run build (= python3 scripts/build.py) が releases/*.zip を生成する。
