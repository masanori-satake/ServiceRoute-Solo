<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiceRoute-Solo</title>
    <style>
      :root {
        --md-sys-color-primary: #0061a4;
        --md-sys-color-surface: #fdfbff;
        --md-sys-color-on-surface: #1a1c1e;
        --md-sys-color-surface-variant: #e0e2ec;
        --md-sys-color-on-surface-variant: #44474e;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        margin: 0;
        padding: 16px;
        width: 320px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
      }

      .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--md-sys-color-on-surface-variant);
        border-radius: 50%;
        transition: background-color 0.2s;
      }

      .btn-icon:hover {
        background-color: var(--md-sys-color-surface-variant);
      }

      .service-card {
        background-color: var(--md-sys-color-surface);
        border: 1px solid var(--md-sys-color-surface-variant);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
      }

      .status-icon {
        font-size: 24px;
        margin-right: 12px;
      }

      .service-info {
        flex-grow: 1;
      }

      .service-name {
        font-weight: bold;
        display: block;
      }

      .service-status-msg {
        font-size: 12px;
        color: var(--md-sys-color-on-surface-variant);
      }

      .failure-duration {
        font-size: 11px;
        color: #ba1a1a;
        margin-left: 4px;
      }

      .last-check {
        font-size: 10px;
        color: var(--md-sys-color-on-surface-variant);
        display: block;
        margin-top: 4px;
      }

      .actions {
        margin-top: 16px;
        text-align: center;
      }

      .btn-small {
        padding: 6px 16px;
        border-radius: 16px;
        font-size: 12px;
        cursor: pointer;
      }

      .empty-state {
        text-align: center;
        padding: 24px;
        color: var(--md-sys-color-on-surface-variant);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>サービス状況</h1>
      <button id="open-settings" class="btn-icon" title="設定">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="currentColor"
        >
          <path
            d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-1 13.5l103 78-110 190-119-50q-11 8-23 15t-24 12L590-80H370Zm70-80h80l12-93q20-5 39-15t35-23l86 36 40-70-76-58q2-11 2.5-22.5T675-480q0-11-.5-22.5T672-525l76-58-40-70-86 36q-16-13-35-23t-39-15l-12-93h-80l-12 93q-20 5-39 15t-35 23l-86-36-40 70 76 58q-2 11-2.5 22.5T285-480q0 11 .5 22.5t2.5 22.5l-76 58 40 70 86-36q16 13 35 23t39 15l12 93Zm40-200q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29ZM480-480Z"
          />
        </svg>
      </button>
    </header>

    <main id="service-container">
      <div class="empty-state">
        サービスが登録されていません。<br />設定から追加してください。
      </div>
    </main>

    <div class="actions">
      <button id="recheck-btn" class="btn-small">今すぐ再チェック</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
